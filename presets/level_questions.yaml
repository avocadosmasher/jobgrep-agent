# UC-1 레벨 측정 질문 뱅크 (T23 · H2) — `docs/UC1_레벨측정_질문세트.md` §4의 표를 데이터로 옮긴 것.
#
# **선택지 라벨은 문서의 행동 마커를 그대로 쓴다.** "얼마나 잘하냐(1~5)"가 아니라
# "무엇을 해봤냐"여야 한다는 것이 질문세트 §1의 첫 번째 불변 원칙이고, 문구를 다시
# 지으면 그 원칙이 조용히 무너진다. 문서를 고치면 이 파일도 같이 고칠 것.
#
# 스키마
#   none_label   : "안 해봤음/모름". 레벨 0이 **아니라** 커버리지 계산의 입력이다(§1).
#   order        : 라디오에 뿌릴 레벨 순서. contracts/enums.py `Level`의 값이며 정본은 enum이다.
#   axes[]
#     id         : 축 식별자. 추출 역량과 못 묶인 축은 이 값이 그대로 comp_id가 된다.
#     category   : contracts/enums.py `Category`의 값. presets/categories.yaml에 있어야 한다.
#     name       : 역량 축 이름. 사용자에게 보이는 질문 제목이자 새로 발견된 역량의 이름.
#     markers    : 레벨 → 그 레벨이 이 축에서 나타나는 **행동**. 라디오 옵션 텍스트가 된다.
#
# 승급 관문 세 개(§2)를 마커가 지키는지가 이 파일의 품질 기준이다:
#   학습함 →[돌아가는 결과물]→ 써봄 →[운영·장애 책임]→ 실무운영 →[설계·주도]→ 설계주도

none_label: 해당 없음 (안 해봤거나 모름)

order:
  - 학습함
  - 써봄
  - 실무운영
  - 설계주도

axes:
