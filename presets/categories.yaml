# 직군 프리셋 — 레벨 측정의 대분류 축 (T23, 설계도 §7-4 · 질문세트 §4)
#
# 이 파일이 코드가 아니라 프리셋인 이유: 대분류는 직군을 바꾸면 통째로 갈리는 것이라
# 코드에 박으면 축 추가·수정이 불가능해진다(질문세트 §7 "하드코딩 금지").
#
# 스키마
#   id     : contracts/enums.py `Category`의 **값** — 여기가 정본이 아니라 enum이 정본이다.
#            없는 값을 적으면 로드 시점에 죽는다(조용히 틀리지 않게).
#   label  : 화면에 뜨는 사람 언어. enum 값(`D1_SW기반`)을 그대로 보여주면 내부 표기가 샌다.
#   order  : 폼에서의 섹션 순서.
#
# **`C_인재상컬처핏`은 여기 없다.** 레벨 사다리(학습함→써봄→실무운영→설계주도)는
# "무엇을 해봤는가"의 깊이 좌표인데 인재상은 그런 축이 아니다. 컬처핏은 JD·인재상
# 문서에서 판정하는 것이지 사용자에게 4단계로 물을 것이 아니다. 질문세트 §3의
# 산출 정의도 `coverage: {D1~D5 → …}`로 다섯 개만 적고 있다.

categories:
  - id: D1_SW기반
    label: 소프트웨어 엔지니어링 기반
    order: 1
  - id: D2_백엔드
    label: 백엔드·서버 개발
    order: 2
  - id: D3_클라우드
    label: 클라우드·인프라
    order: 3
  - id: D4_오케스트레이션
    label: 컨테이너·오케스트레이션·DevOps/SRE
    order: 4
  - id: D5_AI인프라
    label: AI 인프라
    order: 5
